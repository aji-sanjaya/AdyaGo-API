server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/javascript  js mjs;
        text/css                css;
        text/html               html htm;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/svg+xml           svg;
        image/x-icon            ico;
        application/json        json;
        font/woff               woff;
        font/woff2              woff2;
        application/octet-stream bin;
        application/pdf         pdf;
    }

    # index.html: always revalidate (SPA entry point must stay fresh)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # Static assets: allow CORS so Web Workers, dynamic module imports, and fonts never fail
    location ~* \.(js|mjs|css|woff2|woff|png|jpg|jpeg|svg|ico|pdf)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
